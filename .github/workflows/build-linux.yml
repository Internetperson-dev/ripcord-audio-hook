name: Build hook.so (Linux)

on:
  push:
    branches:
      - linux
  pull_request:
    branches:
      - linux
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git

      - name: Build and install funchook
        run: |
          git clone https://github.com/kubo/funchook.git
          cd funchook
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig   # refresh shared library cache

      - name: Build hook.so
        run: |
          make -j$(nproc)
          ls -lh hook.so || echo "hook.so not found!"

      - name: Upload hook.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: hook-library
          path: hook.so
