name: Build hook.so and bundle funchook

on:
  push:
    branches:
      - linux
  pull_request:
    branches:
      - linux
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git cmake pkg-config

      - name: Build funchook
        run: |
          git clone https://github.com/kubo/funchook.git
          cd funchook
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          # copy shared lib next to repo root
          cp libfunchook.so* $GITHUB_WORKSPACE/

      - name: Build hook.so
        run: |
          gcc -shared -fPIC -o hook.so hook.c -ldl -L. -lfunchook
          ls -lh hook.so libfunchook.so*

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ripcord-hook-bundle
          path: |
            hook.so
            libfunchook.so*
